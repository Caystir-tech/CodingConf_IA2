<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coding Conf - Ticket</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <header class="site-header">

        <a href="index.html" class="logo-link">

            <img
                src="../assets/images/logo-full.svg"
                alt="Coding Conf logo"
            >

        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Register
            </a>

        </nav>

    </header>



    <main class="ticket-main">


        <section class="confirmation">

            <p class="small-heading">
                CODING CONF 2026
            </p>


            <h1 class="ticket-heading">
                Congrats,
            <span id="ticketName">Guest</span>!
            <br>
            Your ticket is ready.
            </h1>


            <p>
                We've created your ticket for
                <span id="ticketEmail">your email</span>.
            </p>

        </section>



        <section class="ticket">

            <div class="ticket-top">

                <img
                    src="../assets/images/logo-full.svg"
                    alt="Coding Conf"
                >


                <span>
                    #01609
                </span>

            </div>


            <p class="ticket-event">
                October 26, 2026 / Papine, Kgn
            </p>



            <div class="ticket-person">

                <img
                    id="ticketAvatar"
                    src="../assets/images/image-avatar.jpg"
                    alt="Profile avatar"
                >


                <div>

                    <h2 id="ticketNameCard">
                        Guest
                    </h2>


                    <a
                        id="githubLink"
                        href="#"
                        target="_blank"
                    >

                        <img
                            src="../assets/images/icon-github.svg"
                            alt=""
                        >

                        <span id="ticketGithub">
                            @username
                        </span>

                    </a>

                </div>

            </div>

        </section>



        <a href="login.html" class="back-link">
            Create another ticket
        </a>

    </main>



    <footer class="site-footer">

        <p>
            Coding Conf 2026 &copy; All rights reserved.
        </p>

    </footer>


    <script src="../js/ticket.js"></script>

</body>

</html>
